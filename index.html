<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Волшебное дерево</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--purple:#52327c;--green:#82bd2e;--ink:#292727;--yellow:#f8dc08;--orange:#ef7315;--soft:#f3f1f5}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Montserrat,Arial,sans-serif}button,input,textarea{font:inherit}.shell{max-width:1120px;margin:auto;padding:14px 20px 20px}.hero{text-align:center;max-width:930px;margin:0 auto 12px}.hero h1{font-family:Unbounded,sans-serif;font-size:clamp(30px,4.2vw,48px);line-height:1.02;margin:0 0 8px;color:var(--purple)}.hero p{font-size:clamp(14px,1.55vw,17px);font-weight:500;line-height:1.35;margin:0}.grid{display:grid;grid-template-columns:minmax(0,.86fr) minmax(340px,1.14fr);gap:16px;align-items:stretch}.card{border:2px solid var(--ink);border-radius:22px;box-shadow:5px 5px var(--ink);background:#fff}.start-card{max-width:680px;margin:0 auto;padding:24px;display:grid;gap:14px}.start-card h2{font:700 24px Unbounded;color:var(--purple);margin:0}.start-card p{margin:0;line-height:1.45}.start-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.start-fields label{font-size:12px;font-weight:800}.start-fields input{width:100%;margin-top:6px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:#fff}.start-error{color:#991b14;font-weight:800;margin:0}.student-chip{background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-weight:800}.tree-card{min-height:360px;padding:13px;display:flex;flex-direction:column}.badge{align-self:flex-start;background:var(--yellow);border:2px solid var(--ink);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:800}.prompt{text-align:center;color:var(--purple);font-size:13px;font-weight:800;margin:5px 0 0}.tree{min-height:246px;display:flex;flex-direction:column;align-items:center}.crown{width:min(92%,360px);height:205px;border:3px solid var(--ink);border-radius:48% 52% 44% 56%/58% 55% 45% 42%;background:var(--green);display:flex;align-items:center;justify-content:center;padding:20px 16px;position:relative;z-index:2}.fruits{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:7px;max-width:290px}.fruit{width:54px;height:54px;border:3px solid var(--ink);border-radius:50%;background:#fff;cursor:pointer;font-size:31px;box-shadow:0 3px var(--ink)}.fruit.sel{background:var(--yellow);outline:3px solid #fff;transform:translateY(-3px) scale(1.06)}.trunk{width:58px;height:58px;background:var(--orange);border:3px solid var(--ink);border-top:0;margin-top:-8px}.ground{width:56%;height:12px;background:var(--purple);border:3px solid var(--ink);border-radius:50%;margin-top:-5px}.many .tree{min-height:405px}.many .crown{width:min(98%,390px);height:365px;padding:22px 14px}.many .fruits{gap:4px;max-width:330px}.many .fruit{width:40px;height:40px;font-size:23px}.panel{padding:16px;display:flex;flex-direction:column;gap:9px}.heading{display:flex;justify-content:space-between;align-items:center}.heading span{font:700 18px Unbounded;color:var(--purple)}.heading b{background:var(--ink);color:#fff;border-radius:99px;padding:5px 9px;font-size:11px}.prediction{background:var(--purple);color:#fff;border:2px solid var(--ink);border-radius:16px;padding:11px}.prediction h2,.history h2,.observation h2{font:700 14px Unbounded;margin:0}.prediction p{margin:4px 0 8px;font-size:12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.opts button{border:2px solid var(--ink);border-radius:11px;background:#fff;color:var(--ink);padding:7px;cursor:pointer;font-weight:800}.opts .unknown{grid-column:1/-1}.opts .chosen{background:var(--yellow);box-shadow:0 3px var(--ink)}button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score div,.history,.observation{border:2px solid var(--ink);border-radius:14px;padding:9px}.score div{text-align:center}.score b{display:block;font-size:19px}.score span{font-size:11px;font-weight:700}.history{flex:1;min-height:105px}.history ol{list-style:none;padding:0;margin:7px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:5px}.history li{background:var(--soft);border-radius:9px;padding:5px 7px;font-weight:800;font-size:12px}.empty{color:#777;font-size:13px}.observation{background:#fff8d3;display:grid;gap:7px}.observation p{margin:2px 0 0;font-size:12px}.observation label{font-size:12px;font-weight:800}.observation textarea{width:100%;margin-top:4px;border:2px solid var(--ink);border-radius:10px;padding:7px 9px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.save,.reset{border:2px solid var(--ink);border-radius:12px;padding:9px;font-weight:800;cursor:pointer;box-shadow:0 3px var(--ink)}.next{background:var(--yellow)}.retry{background:#fff}.save{background:var(--green)}.status{font-size:12px;font-weight:700;color:var(--purple);margin:0}.past{margin-top:18px}.past h2{font:700 18px Unbounded;color:var(--purple)}.past article{border:2px solid var(--ink);border-radius:14px;padding:10px 13px;margin:8px 0;box-shadow:3px 3px var(--ink)}.past article p{margin:0}.past blockquote{margin:6px 0 0;padding:7px 10px;border-left:5px solid var(--green);background:var(--soft)}.finish{margin-top:16px;padding:18px}.reset{display:block;margin:16px auto 0;background:#fff}@media(min-width:821px) and (max-height:780px){.hero p{display:none}.hero{margin-bottom:8px}.shell{padding-top:10px}.tree-card{min-height:330px}.tree{min-height:220px}.crown{height:185px}.many .tree{min-height:360px}.many .crown{height:325px}.many .fruit{width:36px;height:36px;font-size:21px}.panel{gap:7px}.history{min-height:86px}.history li{font-size:11px;padding:4px 6px}.observation textarea{height:58px}}@media(max-width:820px){.grid{grid-template-columns:1fr}}@media(max-width:470px){.shell{padding:18px 12px}.start-fields,.opts,.actions{grid-template-columns:1fr}.opts .unknown{grid-column:auto}.history ol{grid-template-columns:1fr}.many .tree{min-height:470px}.many .crown{height:430px}.many .fruits{max-width:270px}.many .fruit{width:40px;height:40px;font-size:23px}}
</style>
</head>
<body><main class="shell"><header class="hero"><h1>Волшебное дерево</h1><p>На дереве растут бананы (Б) и ананасы (А). Садовник каждый раз действует по одним и тем же законам: срывает два плода, а вместо них вырастает один новый. Попробуйте обнаружить эти законы экспериментально и понять, какой плод останется последним.</p></header><div id="app"></div><button class="reset" onclick="resetAll()">↻ Начать заново</button></main>
<script>
// ВСТАВЬТЕ СЮДА URL РАЗВЁРНУТОГО ВЕБ-ПРИЛОЖЕНИЯ GOOGLE APPS SCRIPT:
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCRKuTOlSJ2-cYMSekEhMhV7FeujxktfjlZWvTAMLRTt2U0Aa-CsMXIX-lDOZz9SbyKw/exec";

const trees=[{banana:3,pineapple:4},{banana:5,pineapple:3},{banana:3,pineapple:5},{banana:5,pineapple:2},{banana:4,pineapple:4},{banana:6,pineapple:3},{banana:4,pineapple:7},{banana:7,pineapple:0},{banana:9,pineapple:0},{banana:37,pineapple:8}];
const info={banana:{emoji:'🍌',name:'банан'},pineapple:{emoji:'🍍',name:'ананас'}};
const SAVE_TIMEOUT_MS=12000;
let index=0,fruits=[],selected=[],firstName='',lastName='',studentReady=false,status='',sending=false,startError='',sessionId='',pendingSaves=[];
let experiments=trees.map(()=>({prediction:'',moves:[],observation:'',saved:false}));
function makeFruits(i){return [...Array(trees[i].banana).fill('banana'),...Array(trees[i].pineapple).fill('pineapple')]}
function result(a,b){return a===b?'pineapple':'banana'}
function word(n,f){return f==='banana'?(n===1?'банан':n<5?'банана':'бананов'):(n===1?'ананас':n<5?'ананаса':'ананасов')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem('volshebnoe-derevo-progress',JSON.stringify({firstName,lastName,studentReady,index,experiments,sessionId,fruits,pendingSaves}))}
function fullName(){return `${firstName.trim()} ${lastName.trim()}`.trim()}
function updateFirstName(v){firstName=v;startError='';persist()}
function updateLastName(v){lastName=v;startError='';persist()}
function ensureSession(){if(!sessionId)sessionId=`tree-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;return sessionId}
function stateText(){const b=fruits.filter(x=>x==='banana').length,a=fruits.filter(x=>x==='pineapple').length;return `${b} бананов, ${a} ананасов`}
function basePayload(event,extra={}){const e=experiments[index]||{};return Object.assign({name:fullName()||'Имя не указано',event,tree:index+1,startBanana:trees[index]?.banana??'',startPineapple:trees[index]?.pineapple??'',prediction:e.prediction==='unknown'?'пока не знаю':e.prediction?info[e.prediction].name:'не указан',attempt:e.moves?e.moves.length:'',action:'',state:stateText(),finalFruit:e.finalFruit?info[e.finalFruit].name:'',observation:e.observation||'',sessionId:ensureSession(),page:location.href,source:'volshebnoe-derevo'},extra)}
function postToGoogle(payload,timeoutMs=SAVE_TIMEOUT_MS){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);return fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:controller.signal}).finally(()=>clearTimeout(timer))}
function saveToGoogle(payload){if(!document.createElement)return postToGoogle(payload);return new Promise((resolve,reject)=>{const callbackName=`magicTreeSave_${Date.now()}_${Math.random().toString(36).slice(2)}`;const script=document.createElement('script');const timer=setTimeout(()=>cleanup(()=>reject(new Error('timeout'))),SAVE_TIMEOUT_MS);function cleanup(done){clearTimeout(timer);delete window[callbackName];script.remove();done&&done()}window[callbackName]=(response)=>cleanup(()=>response&&response.ok?resolve(response):reject(new Error(response&&response.error||'save failed')));script.onerror=()=>cleanup(()=>reject(new Error('network')));script.src=`${GOOGLE_SCRIPT_URL}?callback=${encodeURIComponent(callbackName)}&payload=${encodeURIComponent(JSON.stringify(payload))}`;document.body.appendChild(script)})}
function rememberPending(payload){const key=`${payload.sessionId}|${payload.tree}|${payload.observation}`;if(!pendingSaves.some(item=>item.key===key))pendingSaves.push({key,payload});persist()}
async function flushPending(){if(!pendingSaves.length||GOOGLE_SCRIPT_URL.includes('PASTE_'))return;const queue=[...pendingSaves];for(const item of queue){try{await saveToGoogle(item.payload);pendingSaves=pendingSaves.filter(x=>x.key!==item.key);persist()}catch(err){break}}}
function sendEvent(event,extra={}){persist();if(GOOGLE_SCRIPT_URL.includes('PASTE_'))return;const body=JSON.stringify(basePayload(event,extra));if(navigator.sendBeacon&&navigator.sendBeacon(GOOGLE_SCRIPT_URL,new Blob([body],{type:'text/plain;charset=utf-8'})))return;postToGoogle(basePayload(event,extra),6000).catch(()=>{})}
function startStudent(){if(!firstName.trim()||!lastName.trim()){startError='Пожалуйста, напишите имя и фамилию.';render();return}studentReady=true;startError='';ensureSession();persist();sendEvent('Вход ученика',{tree:'',startBanana:'',startPineapple:'',prediction:'',attempt:'',action:'Ученик начал игру',state:''});flushPending();render()}
function choose(i){if(fruits.length===1||selected.includes(i))return;if(!selected.length){selected=[i];render();return}const a=selected[0],r=result(fruits[a],fruits[i]);const move=`${info[fruits[a]].emoji} + ${info[fruits[i]].emoji} → ${info[r].emoji}`;fruits=fruits.filter((_,k)=>k!==a&&k!==i).concat(r);selected=[];experiments[index].moves.push(move);if(fruits.length===1)experiments[index].finalFruit=fruits[0];persist();sendEvent('Ход',{attempt:experiments[index].moves.length,action:move,state:stateText(),finalFruit:experiments[index].finalFruit?info[experiments[index].finalFruit].name:''});render()}
function predict(p){const e=experiments[index];if(!e.moves.length||fruits.length===1){status=!e.moves.length?'Сначала выберите два плода и проведите первый опыт.':'Прогноз уже нельзя менять: дерево завершено.';render();return}e.prediction=p;status='Прогноз сохранён. Теперь продолжайте эксперимент.';persist();sendEvent('Прогноз',{action:p==='unknown'?'Пока не знаю':info[p].name});render()}
function updateObs(v){experiments[index].observation=v;experiments[index].saved=false;persist()}
async function submit(show=true){const e=experiments[index];if(sending)return false;if(!e.observation.trim()){if(show){status='Пожалуйста, напишите, что вы заметили.';render()}return false}if(GOOGLE_SCRIPT_URL.includes('PASTE_')){e.saved=true;e.pending=true;status=show?'Догадка сохранена на этом устройстве. Можно идти дальше.':'';persist();render();return true}sending=true;if(show)status='Сохраняем догадку…';render();const payload=basePayload('Ответ сохранён',{attempt:e.moves.length,action:'Ученик записал догадку',state:stateText(),finalFruit:e.finalFruit?info[e.finalFruit].name:'',observation:e.observation.trim()});try{await postToGoogle(payload);e.saved=true;e.pending=false;status=show?'Догадка сохранена. Можно переходить к следующему дереву.':'';return true}catch(err){rememberPending(payload);e.saved=true;e.pending=true;if(show)status='Догадка сохранена на этом устройстве. Можно идти дальше; отправка преподавателю повторится автоматически.';return true}finally{sending=false;persist();render()}}
async function next(){const e=experiments[index];if(fruits.length!==1||index>=trees.length-1)return;if(!e.saved){status=e.observation.trim()?'Сначала сохраните догадку. Если не получилось, нажмите «Повторить сохранение».':'Сначала напишите и сохраните догадку.';render();return}index++;fruits=makeFruits(index);selected=[];status='';persist();render()}
function retry(){fruits=makeFruits(index);selected=[];status='';Object.assign(experiments[index],{moves:[],finalFruit:undefined,saved:false});persist();sendEvent('Повтор дерева',{attempt:'',action:'Ученик начал это дерево заново',state:stateText(),finalFruit:''});render()}
function resetAll(){index=0;fruits=makeFruits(0);selected=[];firstName='';lastName='';studentReady=false;status='';startError='';sessionId='';pendingSaves=[];experiments=trees.map(()=>({prediction:'',moves:[],observation:'',saved:false}));persist();render()}
function ruleText(){return index===0?'Проведите опыты с первым деревом и попробуйте понять, по каким правилам вырастает новый плод после того, как садовник срывает два плода.':'Правила превращений: 🍌 + 🍌 → 🍍, 🍍 + 🍍 → 🍍, 🍌 + 🍍 → 🍌. Пользуйтесь ими, чтобы заранее предсказать, что останется последним.'}
function render(){if(!studentReady){document.getElementById('app').innerHTML=`<section class="card start-card"><h2>Как вас зовут?</h2><p>Напишите имя и фамилию, чтобы все ответы сохранились с вашей подписью.</p><div class="start-fields"><label>Имя<input value="${esc(firstName)}" oninput="updateFirstName(this.value)" onkeydown="if(event.key==='Enter')startStudent()" placeholder="Например, Маша" autocomplete="given-name"></label><label>Фамилия<input value="${esc(lastName)}" oninput="updateLastName(this.value)" onkeydown="if(event.key==='Enter')startStudent()" placeholder="Например, Иванова" autocomplete="family-name"></label></div>${startError?`<p class="start-error">${esc(startError)}</p>`:''}<button class="save" onclick="startStudent()">Начать эксперимент</button></section>`;return}const e=experiments[index],done=fruits.length===1,last=index===trees.length-1&&done;const counts={banana:fruits.filter(x=>x==='banana').length,pineapple:fruits.filter(x=>x==='pineapple').length};const prompt=done?`Остался ${info[fruits[0]].name}`:selected.length?'Теперь выберите второй плод':'Нажмите на два плода, чтобы провести опыт';const hint=index===0?'Напишите, какие правила превращений вы заметили.':index===1?'Опираясь на правила, объясните, почему в конце остался именно этот плод.':done?`Попробуйте объяснить, почему в конце остался ${info[fruits[0]].name}.`:'';const canPredict=e.moves.length>0&&!done;const predictHint=!e.moves.length?'Сначала выберите два плода и проведите первый опыт. После этого прогноз станет доступен.':done?'Дерево завершено, прогноз уже зафиксирован.':'Теперь можно сделать прогноз: какой плод останется последним?';const saveText=sending?'Сохраняем…':e.saved?e.pending?'Сохранено на устройстве ✓':'Сохранено ✓':'Сохранить';const nextDisabled=!e.saved;document.getElementById('app').innerHTML=`<section class="grid"><div class="card tree-card ${index===trees.length-1?'many':''}"><div class="badge">Дерево ${index+1}</div><p class="prompt">${prompt}</p><div class="tree"><div class="crown"><div class="fruits">${fruits.map((f,i)=>`<button class="fruit ${selected.includes(i)?'sel':''}" onclick="choose(${i})" aria-label="Выбрать ${info[f].name}" ${done?'disabled':''}>${info[f].emoji}</button>`).join('')}</div></div><div class="trunk"></div><div class="ground"></div></div></div><aside class="card panel"><div class="heading"><span>Эксперимент ${index+1}</span><b>${trees[index].banana}Б · ${trees[index].pineapple}А</b></div><section class="prediction"><h2>${index===0?'Откройте правило':'Правила перед глазами'}</h2><p>${ruleText()}</p></section><section class="prediction"><h2>Ваш прогноз</h2><p>${predictHint}</p><div class="opts"><button class="${e.prediction==='banana'?'chosen':''}" onclick="predict('banana')" ${canPredict?'':'disabled'}>🍌 банан</button><button class="${e.prediction==='pineapple'?'chosen':''}" onclick="predict('pineapple')" ${canPredict?'':'disabled'}>🍍 ананас</button><button class="unknown ${e.prediction==='unknown'?'chosen':''}" onclick="predict('unknown')" ${canPredict?'':'disabled'}>🤔 Пока не знаю</button></div>${!done&&status?`<p class="status">${esc(status)}</p>`:''}</section><section class="score"><div><b>🍌 ${counts.banana}</b><span>бананов</span></div><div><b>🍍 ${counts.pineapple}</b><span>ананасов</span></div></section><section class="history"><h2>История ходов</h2>${e.moves.length?`<ol>${e.moves.map((m,i)=>`<li>${i+1}. ${m}</li>`).join('')}</ol>`:'<p class="empty">Здесь появятся ваши превращения</p>'}</section>${done?`<section class="observation"><h2>Что заметили?</h2><p>${hint}</p><div class="student-chip">Ученик: ${esc(fullName())}</div><label>Ваша догадка<textarea oninput="updateObs(this.value)" rows="3" placeholder="Напишите свою догадку…">${esc(e.observation)}</textarea></label><button class="save" onclick="submit(true)" ${sending||e.saved?'disabled':''}>${saveText}</button>${status?`<p class="status">${esc(status)}</p>`:''}</section><div class="actions"><button class="retry" onclick="retry()">↻ Ещё раз попробовать это дерево</button>${!last?`<button class="next" onclick="next()" ${nextDisabled?'disabled':''} title="${nextDisabled?'Сначала сохраните догадку':''}">Следующее дерево →</button>`:''}</div>`:''}</aside></section>${index?`<section class="past"><h2>Прошлые эксперименты</h2>${experiments.slice(0,index).map((x,i)=>`<article><p><b>Дерево ${i+1}:</b> ${trees[i].banana} ${word(trees[i].banana,'banana')} и ${trees[i].pineapple} ${word(trees[i].pineapple,'pineapple')} → <strong>${x.finalFruit?info[x.finalFruit].name:'—'}</strong></p><blockquote>${esc(x.observation||'Догадка не записана')}</blockquote></article>`).join('')}</section>`:''}${last?'<section class="card finish"><h2>Эксперименты завершены!</h2><p>Спасибо! Вы исследовали все волшебные деревья.</p></section>':''}`}
try{const saved=JSON.parse(localStorage.getItem('volshebnoe-derevo-progress')||'null');if(saved){firstName=saved.firstName||saved.name||'';lastName=saved.lastName||'';studentReady=!!saved.studentReady||!!(firstName&&lastName);index=Number(saved.index)||0;experiments=Array.isArray(saved.experiments)?saved.experiments:experiments;sessionId=saved.sessionId||'';pendingSaves=Array.isArray(saved.pendingSaves)?saved.pendingSaves:[];fruits=Array.isArray(saved.fruits)&&saved.fruits.length?saved.fruits:makeFruits(index)}}catch(e){}
if(!fruits.length)fruits=makeFruits(index);flushPending();render();
</script></body></html>
